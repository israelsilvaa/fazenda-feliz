<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fazenda Feliz v3</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#7fcf6e;--g2:#72c262;--soil:#8a5a35;--soil2:#6b4326;--panel:#fff7dc;--ink:#3b2a14;--line:#e6d79b;--sun:#ffcf33;--water:#3ab8f0;--ok:#4caf2e;--top:calc(env(safe-area-inset-top,0px) + 8px);--bot:calc(env(safe-area-inset-bottom,0px) + 64px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#2f5d2a;--g2:#295426;--soil:#6b4326;--soil2:#52331b;--panel:#2c2a1f;--ink:#f4ead2;--line:#4b4730}}
:root[data-theme="dark"]{--g1:#2f5d2a;--g2:#295426;--soil:#6b4326;--soil2:#52331b;--panel:#2c2a1f;--ink:#f4ead2;--line:#4b4730}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;background:repeating-linear-gradient(45deg,var(--g1) 0 28px,var(--g2) 28px 56px)}
#view{position:fixed;inset:0;touch-action:none;cursor:grab}
#map{position:absolute;left:0;top:0;display:grid;gap:6px;padding:10px;background:#0002;border:4px solid var(--soil2);border-radius:18px;will-change:transform}
.plot{width:74px;height:74px;border-radius:12px;position:relative;display:grid;place-items:center;font-size:36px;border:3px solid var(--soil2);background:repeating-linear-gradient(90deg,var(--soil) 0 10px,var(--soil2) 10px 12px)}
.tm{position:absolute;top:1px;left:5px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;z-index:2}
.em{position:relative;z-index:1;display:grid;place-items:center}
.bar{position:absolute;left:7px;right:7px;bottom:5px;height:6px;border-radius:4px;background:#0006;overflow:hidden;z-index:2}
.bar u{display:block;height:100%;width:0;background:#7ddc5a}
.wet{background:repeating-linear-gradient(90deg,#4a3320 0 10px,#35220f 10px 12px);box-shadow:0 0 0 3px var(--water),0 0 14px 3px #3ab8f0aa}
.wet::after{content:'💧';position:absolute;top:0;right:3px;font-size:15px;animation:drip 1.6s ease-in infinite}
.wet .bar u{background:var(--water)}
.ready{box-shadow:0 0 0 3px var(--sun);animation:bob .8s ease-in-out infinite}
.ready .bar u{background:#ffb02e}
.late .bar u{animation:blink .5s steps(2) infinite}
.dead{filter:grayscale(.8) brightness(.8)}
.dead .bar{display:none}
.splash{animation:splash .45s}
.qd::before{content:'⏳';position:absolute;left:4px;bottom:11px;font-size:14px;z-index:2}
.work{box-shadow:0 0 0 3px #fff8}
.work .bar u{background:#fff}
/* radar */
.rd{position:absolute;inset:5px;border-radius:50%;display:none;overflow:hidden;border:2px solid #9fffb0aa;background:radial-gradient(circle,#0000 0 28%,#9fffb055 29% 31%,#0000 32% 58%,#9fffb044 59% 61%,#0000 62%),#0a2a10aa}
.work .rd{display:block}
.rd::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#0000 0 70%,#9fffb0e0 100%);animation:sweep 1.2s linear infinite}
/* fazendeiro */
.em svg{width:44px;height:44px;overflow:visible}
.bd{animation:hop .55s ease-in-out infinite alternate}
.hoe{transform-origin:30px 27px;animation:swing .55s ease-in-out infinite alternate}
.tl{position:absolute;right:-8px;top:-8px;font-size:16px;font-style:normal;animation:bob .55s ease-in-out infinite}
#pens{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pen{background:repeating-linear-gradient(0deg,#c99a4b 0 9px,#b5863c 9px 11px);border-color:#7a5420}
.cnt{position:absolute;top:1px;right:4px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;z-index:2}
@keyframes sweep{to{transform:rotate(1turn)}}
@keyframes swing{from{transform:rotate(-38deg)}to{transform:rotate(28deg)}}
@keyframes hop{to{transform:translateY(-1.5px)}}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(5px);opacity:.2}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{50%{opacity:.2}}
@keyframes splash{40%{box-shadow:0 0 0 12px #3ab8f099;transform:scale(1.07)}}
.p{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:5px 10px;position:fixed;z-index:5}
#lv{top:var(--top);left:calc(env(safe-area-inset-left,0px) + 8px);min-width:128px;font-weight:700}
#lv small{display:block;height:7px;border-radius:5px;background:#0003;margin-top:3px;overflow:hidden}
#lv u{display:block;height:100%;width:0;background:var(--sun)}
#co{top:var(--top);right:calc(env(safe-area-inset-right,0px) + 8px);font-weight:700;font-size:19px}
#wk{top:var(--top);left:50%;transform:translateX(-50%);font-weight:700;font-size:15px;white-space:nowrap;padding:4px 8px}
.fab{position:fixed;z-index:6;width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--panel);font-size:22px;line-height:1;padding:0;cursor:pointer;color:inherit;bottom:calc(var(--bot) + var(--n,0)*64px)}
.fab small{display:block;font-size:9px;font-weight:600;margin-top:1px}
.fab.l{left:calc(env(safe-area-inset-left,0px) + 10px)}
.fab.r{right:calc(env(safe-area-inset-right,0px) + 10px)}
.fab.on{background:var(--water);border-color:#fff;box-shadow:0 0 0 3px var(--water)}
#bc{display:none;background:#ffd6d0;color:#7a1d10;border-color:#e57a6a}#bc.on{display:block;background:#ffd6d0;box-shadow:none;border-color:#e57a6a}
#bcn{font-size:17px;font-weight:700}
#dock{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 76px);right:calc(env(safe-area-inset-right,0px) + 76px);bottom:var(--bot);display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chip{position:relative;flex:0 0 auto;min-width:62px;height:56px;border-radius:14px;border:3px solid var(--line);background:var(--panel);color:inherit;font:inherit;font-size:24px;line-height:1;padding:2px 6px;cursor:pointer}
.chip small{display:block;font-size:11px;font-weight:600;margin-top:2px}
.chip.on{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.chip.lock{background:#0003;border-style:dashed}
.chip.lock .g{filter:grayscale(1);opacity:.35}
.chip b{position:absolute;top:2px;right:3px;font-size:13px}
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:#0007}
#sheet.on{display:flex}
.box{background:var(--panel);width:100%;max-width:520px;margin:0 auto;max-height:78dvh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.box h2{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:2px solid var(--line)}
.row .i{font-size:28px}.row .t{flex:1}.row small{display:block;opacity:.8}
.box button{font:inherit;cursor:pointer;color:#3b2a14;background:var(--sun);border:0;border-radius:10px;padding:7px 12px;font-weight:600}
.box button:disabled{opacity:.4;cursor:not-allowed}
.row.lock{opacity:.6}.row.lock .i{filter:grayscale(1)}
.tag{display:inline-block;background:#0002;border-radius:8px;padding:0 6px;font-size:12px;font-weight:700;opacity:1}
.gold{background:var(--sun);color:#3b2a14}
.row.done{background:linear-gradient(90deg,#4caf2e33,#4caf2e0d);border:2px solid var(--ok);border-radius:12px;margin:4px 0}
.row.done .tag{background:var(--ok);color:#fff}
.ok{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700}
.row.pend .i{filter:grayscale(1);opacity:.7}
#bn{position:fixed;z-index:30;top:calc(var(--top) + 58px);left:50%;transform:translate(-50%,-20px);background:var(--sun);color:#3b2a14;font-weight:700;padding:8px 16px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;text-align:center;max-width:90vw}
#bn.on{opacity:1;transform:translate(-50%,0)}
.pop{position:fixed;pointer-events:none;font-weight:700;color:#fff;text-shadow:0 1px 3px #000b;z-index:9;animation:up .9s forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-44px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ready,.pop,.wet::after,.late .bar u,.splash,.hoe,.bd,.tl{animation:none}.rd::before{animation-duration:3s}}
:focus-visible{outline:3px solid #2b7de9;outline-offset:2px}
</style>
</head>
<body>
<div id="view"><div id="map"></div></div>
<div class="p" id="lv"><span id="lvt"></span><small><u id="xpb"></u></small></div>
<div class="p" id="wk"><span id="wkt"></span></div>
<div class="p" id="co">💰 <span id="coins">0</span></div>
<button class="fab l" id="bw" aria-label="Regar">💧</button>
<button class="fab l" id="bh" style="--n:1" aria-label="Colher tudo">🧺<small>Colher</small></button>
<button class="fab l" id="bp" style="--n:2" aria-label="Plantar tudo">🌱<small>Plantar</small></button>
<button class="fab r" id="bs" aria-label="Loja">🛒</button>
<button class="fab r" id="ba" style="--n:1" aria-label="Conquistas">🏆</button>
<button class="fab r" id="bc" style="--n:2" aria-label="Cancelar fila"><span id="bcn"></span><small>Cancelar</small></button>
<div id="dock"></div>
<div id="bn"></div>
<div id="sheet"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s),KEY='fazenda-feliz-v2',DEAD=3e5,WL=[1,2,3,4,6,8,10,12,14,16];

// ---------- Dados ----------
const CR=[ // k, nome, emoji, custo, venda, tempo(s), nível
 ['cenoura','Cenoura','🥕',5,12,10,1],['batata','Batata','🥔',8,20,15,2],['trigo','Trigo','🌾',10,26,20,2],
 ['milho','Milho','🌽',20,55,35,3],['tomate','Tomate','🍅',35,95,55,4],['alface','Alface','🥬',45,125,70,5],
 ['morango','Morango','🍓',50,140,75,5],['abobora','Abóbora','🎃',60,170,90,6],['pimenta','Pimenta','🌶️',75,215,105,7],
 ['melancia','Melancia','🍉',100,290,140,8],['berinjela','Berinjela','🍆',130,370,170,9],['brocolis','Brócolis','🥦',160,460,200,10],
 ['uva','Uva','🍇',220,640,260,12],['abacaxi','Abacaxi','🍍',300,880,330,13],['girassol','Girassol','🌻',400,1200,420,15],
 ['manga','Manga','🥭',550,1650,540,17],['coco','Coco','🥥',800,2400,720,19]
].map(([k,n,e,cost,sell,t,lv])=>({k,n,e,cost,sell,t,lv,xp:Math.round(t*.4)}));
const C=Object.fromEntries(CR.map(c=>[c.k,c]));
const AM=[ // animais: k, nome, emoji, produto, emoji prod, valor, intervalo(s), capacidade, máx, nível, preço base, passo
 ['hen','Galinha','🐔','Ovo','🥚',8,15,12,6,2,60,40],['cow','Vaca','🐄','Leite','🥛',40,40,6,3,5,250,150],
 ['sheep','Ovelha','🐑','Lã','🧶',70,60,6,3,8,500,300],['pig','Porco','🐖','Bacon','🥓',120,90,5,3,11,900,500],
 ['bee','Colmeia','🐝','Mel','🍯',200,120,4,2,14,1500,800]
].map(([k,n,e,pn,pe,val,every,cap,max,lv,base,step])=>({k,n,e,pn,pe,val,every,cap,max,lv,base,step}));
const A=[ // id, emoji, nome, descrição, teste, prêmio
 ['first','🥇','Primeira colheita','Colha 1 planta',()=>S.st.h>=1,10],
 ['w10','💧','Chuva de verão','Regue 10 vezes',()=>S.st.w>=10,15],
 ['hen','🐔','Galinheiro','Compre uma galinha',()=>cnt('hen')>=1,25],
 ['h25','🧺','Cesta cheia','Colha 25 plantas',()=>S.st.h>=25,25],
 ['l5','⭐','Nível 5','Chegue ao nível 5',()=>S.lv>=5,40],
 ['wk3','🧑‍🌾','Time de campo','Tenha 3 trabalhadores',()=>S.wk>=3,40],
 ['e20','🥚','Cesta de ovos','Colete 20 ovos',()=>S.st.e>=20,40],
 ['r1','💰','Bolso cheio','Ganhe 1.000 moedas',()=>S.st.g>=1e3,50],
 ['cow','🐄','Vaqueiro','Compre uma vaca',()=>cnt('cow')>=1,60],
 ['h100','🚜','Mão na terra','Colha 100 plantas',()=>S.st.h>=100,80],
 ['land','🌳','Terra grande','Tenha 36 canteiros',()=>S.cols*S.rows>=36,90],
 ['sheep','🐑','Pastor','Compre uma ovelha',()=>cnt('sheep')>=1,100],
 ['r3','🏦','Fazendeiro rico','Ganhe 3.000 moedas',()=>S.st.g>=3e3,120],
 ['wk6','👷','Mutirão','Tenha 6 trabalhadores',()=>S.wk>=6,150],
 ['l10','🌟','Nível 10','Chegue ao nível 10',()=>S.lv>=10,150],
 ['bee','🐝','Apicultor','Compre uma colmeia',()=>cnt('bee')>=1,200],
 ['r6','👑','Barão da roça','Ganhe 6.000 moedas',()=>S.st.g>=6e3,250],
 ['h500','🏭','Colheitadeira','Colha 500 plantas',()=>S.st.h>=500,300],
 ['wk10','🪖','Exército verde','Tenha 10 trabalhadores',()=>S.wk>=10,400],
 ['r10','💎','Magnata da fazenda','Ganhe 10.000 moedas',()=>S.st.g>=1e4,500],
 ['r30','🏆','Dono do vale','Ganhe 30.000 moedas',()=>S.st.g>=3e4,1000]];

// ---------- Estado ----------
const need=l=>25*l,fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const spd=()=>.85**S.sp,HT=()=>5000*spd(),pt=k=>(1500+Math.min(3500,k.t*25))*spd();
const fresh=()=>({coins:30,lv:1,xp:0,cols:4,rows:4,pl:{},an:{},q:[],wk:1,sp:0,ach:{},st:{h:0,w:0,g:0,e:0},last:Date.now()});
let S=fresh(),sel='cenoura',last='cenoura',armed=false,cells=[],cm={},pens=[],tickN=0,fn=null;
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){S=Object.assign(fresh(),j);
  [['hen','hens','eggs','eggT'],['cow','cows','milk','milkT']].forEach(([k,n,q,t])=>{if(j[n]&&!S.an[k])S.an[k]={n:j[n],q:j[q]||0,t:j[t]||0,a:0}})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=k=>S.pl[k]||(S.pl[k]={c:null,p:0,w:0,a:0});
const AN=k=>S.an[k]||(S.an[k]={n:0,q:0,t:0,a:0}),cnt=k=>AN(k).n;
const earn=n=>{S.coins+=n;S.st.g+=n};
const free=()=>S.wk-[...Object.values(S.pl),...Object.values(S.an)].filter(x=>x.a).length;
const done=()=>{chk();save();ui()};

// ---------- UI utilitária ----------
let bt;function bn(t){const b=$('#bn');b.textContent=t;b.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('on'),2600)}
function pop(el,t){if(!el)return;const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='pop';s.textContent=t;s.style.left=(r.left+r.width/2-30)+'px';s.style.top=(r.top+r.height/3)+'px';document.body.append(s);setTimeout(()=>s.remove(),900)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}};
const FARM=t=>`<svg viewBox="0 0 48 48"><g class="bd"><rect x="18" y="38" width="5" height="8" rx="2" fill="#5b3a1e"/><rect x="26" y="38" width="5" height="8" rx="2" fill="#5b3a1e"/><rect x="16" y="24" width="18" height="16" rx="5" fill="#3a7bd5"/><rect x="16" y="24" width="18" height="6" rx="3" fill="#d9534f"/><circle cx="25" cy="18" r="6.5" fill="#f3c9a0"/><circle cx="27.5" cy="18" r="1" fill="#3b2a14"/><ellipse cx="25" cy="13.5" rx="13" ry="3.2" fill="#e8b84a"/><path d="M17 13.5a8 7 0 0 1 16 0z" fill="#f2c85b"/></g><g class="hoe"><path d="M30 27L43 9" stroke="#7a4a22" stroke-width="3" stroke-linecap="round"/><path d="M39 8L47 5L46 14Z" fill="#9aa5ad"/><circle cx="30" cy="27" r="3" fill="#f3c9a0"/></g></svg><i class="tl">${t}</i>`;
const CELL='<span class="tm"></span><span class="em"></span><i class="rd"></i><i class="bar"><u></u></i>';
function mk(cls,extra=''){const d=document.createElement('div');d.className=cls;d.innerHTML=CELL+extra;return{d,tm:d.querySelector('.tm'),em:d.querySelector('.em'),u:d.querySelector('u'),ct:d.querySelector('.cnt')}}
function paint(x,cls,em,tm,bw){
  if(x.eh!==em){x.eh=em;x.em.innerHTML=em}
  x.tm.textContent=tm;x.u.style.width=(bw*100)+'%';
  cls+=x.d.classList.contains('splash')?' splash':'';
  if(x.d.className!==cls)x.d.className=cls}

function addXp(n){S.xp+=n;while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;
  const u=[...CR.filter(c=>c.lv===S.lv).map(c=>c.e+' '+c.n),...AM.filter(m=>m.lv===S.lv).map(m=>m.e+' '+m.n)];
  bn(`Nível ${S.lv}!`+(u.length?` Desbloqueou: ${u.join(', ')}`:'')+(WL.includes(S.lv)?' 🧑‍🌾':''));buildDock()}}

// ---------- Dock ----------
function buildDock(){
  $('#dock').innerHTML=CR.map(c=>S.lv<c.lv?`<button class="chip lock" data-k="${c.k}"><span class="g">${c.e}</span><b>🔒</b><small>Nv ${c.lv}</small></button>`:`<button class="chip" data-k="${c.k}">${c.e}<small>${c.cost} 💰</small></button>`).join('')}
$('#dock').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const c=C[b.dataset.k];
  if(S.lv<c.lv)return bn(`${c.e} ${c.n} libera no nível ${c.lv}`);sel=last=c.k;ui()};
$('#bw').onclick=()=>{sel=sel==='agua'?last:'agua';ui()};

// ---------- Mapa ----------
const view=$('#view'),map=$('#map');let px=0,py=0,drag=null,moved=false;
function buildMap(){
  map.innerHTML='';cells=[];cm={};pens=[];
  const own=AM.filter(m=>cnt(m.k));
  if(own.length){const w=document.createElement('div');w.id='pens';map.append(w);
    own.forEach(m=>{const x=mk('plot pen','<span class="cnt"></span>');x.d.dataset.pen=m.k;x.m=m;w.append(x.d);pens.push(x)})}
  map.style.gridTemplateColumns=`repeat(${S.cols},74px)`;
  for(let r=0;r<S.rows;r++)for(let c=0;c<S.cols;c++){
    const x=mk('plot'),key=r+','+c;x.d.dataset.key=key;x.key=key;map.append(x.d);cells.push(cm[key]=x)}
  fit();
}
function fit(){
  const vw=view.clientWidth,vh=view.clientHeight,mw=map.offsetWidth,mh=map.offsetHeight,T=70,B=150,pad=12,ah=vh-T-B;
  px=mw+pad*2<=vw?(vw-mw)/2:Math.min(pad,Math.max(vw-mw-pad,px));
  py=mh<=ah?T+(ah-mh)/2:Math.min(T,Math.max(vh-B-mh,py));
  map.style.transform=`translate(${px}px,${py}px)`;
}
view.addEventListener('pointerdown',e=>{drag={x:e.clientX-px,y:e.clientY-py,sx:e.clientX,sy:e.clientY};moved=false});
addEventListener('pointermove',e=>{if(!drag)return;
  if(!moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)moved=true;
  if(moved){px=e.clientX-drag.x;py=e.clientY-drag.y;fit()}});
addEventListener('pointerup',()=>{drag=null;setTimeout(()=>moved=false,0)});
addEventListener('pointercancel',()=>{drag=null});
addEventListener('resize',fit);
map.onclick=e=>{if(moved)return;const d=e.target.closest('.plot');if(d)act(d.dataset.pen?'pen:'+d.dataset.pen:d.dataset.key,d)};

// ---------- Trabalhadores e fila ----------
function start(t){
  const n=Date.now();
  if(t.k.startsWith('pen:')){const a=AN(t.k.slice(4));if(a.n&&a.q&&!a.a)a.a={t:'c',s:n,e:n+HT()};return}
  const p=P(t.k);
  if(t.t==='p'){
    const k=C[t.c];if(p.c||p.a)return;
    if(S.coins<k.cost)return bn('Faltam moedas para plantar');
    S.coins-=k.cost;const e=n+pt(k);Object.assign(p,{c:t.c,p:e,w:0,a:{t:'p',s:n,e}});pop(cm[t.k]&&cm[t.k].d,`-${k.cost}`);
  }else if(p.c&&!p.a&&n>=p.p+C[p.c].t*1000)p.a={t:'h',s:n,e:n+HT()};
}
const pump=()=>{while(S.q.length&&free()>0)start(S.q.shift())};
const queued=k=>S.q.some(t=>t.k===k);
function run(t,d){if(queued(t.k))return pop(d,'Na fila ⏳');if(free()<=0)return pop(d,'Sem trabalhador livre');start(t)}
function enqueue(ts){S.q.push(...ts);pump()}

function act(key,d){
  const n=Date.now();
  if(key.startsWith('pen:')){const a=AN(key.slice(4));
    if(a.a)return pop(d,'Coletando...');if(!a.q)return pop(d,'Nada para coletar');run({k:key,t:'c'},d)}
  else{
    const p=P(key);
    if(p.a)return pop(d,p.a.t==='p'?'Plantando...':'Colhendo...');
    if(!p.c){if(sel==='agua')return pop(d,'Plante antes de regar');run({k:key,t:'p',c:sel},d)}
    else{const k=C[p.c],tot=k.t*1000,el=n-p.p;
      if(el>=tot+DEAD){p.c=null;p.w=0;pop(d,'Limpo')}
      else if(el>=tot)run({k:key,t:'h'},d);
      else if(sel==='agua'&&!p.w){p.p-=(tot-el)*.4;p.w=1;S.st.w++;addXp(1);pop(d,'💦');d.classList.add('splash');setTimeout(()=>d.classList.remove('splash'),450);buzz()}
      else pop(d,p.w?'Já regada 💧':'Crescendo...')}
  }
  done();
}
function bulk(kind){
  const n=Date.now(),ts=[],ok=t=>!queued(t.k);
  if(kind==='p'){
    const c=sel==='agua'?last:sel,k=C[c];
    cells.forEach(x=>{const p=S.pl[x.key];if(!(p&&(p.c||p.a)))ts.push({k:x.key,t:'p',c})});
    const can=Math.floor(S.coins/k.cost);
    if(!ts.length)return bn('Sem canteiros livres');
    if(!can)return bn(`Faltam moedas para ${k.e} ${k.n}`);
    ts.splice(can);
  }else{
    cells.forEach(x=>{const p=S.pl[x.key];if(!p||!p.c||p.a)return;const tot=C[p.c].t*1000,el=n-p.p;
      if(el>=tot+DEAD){p.c=null;p.w=0}else if(el>=tot)ts.push({k:x.key,t:'h'})});
    pens.forEach(x=>{const a=AN(x.m.k);if(a.q&&!a.a)ts.push({k:'pen:'+x.m.k,t:'c'})});
    if(!ts.length)return bn('Nada para colher');
  }
  const add=ts.filter(ok);enqueue(add);bn(`${add.length} tarefas na fila`);done();
}
$('#bh').onclick=()=>bulk('h');$('#bp').onclick=()=>bulk('p');
$('#bc').onclick=()=>{const n=S.q.length;S.q=[];bn(`Fila cancelada (${n})`);done()};

// ---------- Loja ----------
const lc=()=>50*(S.cols+S.rows-7),wc=()=>Math.round(6*S.wk**1.8)*10,bc=()=>150*(S.sp+1)**2;
const SH=()=>{const mx=S.cols>=10&&S.rows>=10;return[
  {id:'land',i:'🌱',t:'Ampliar terreno',s:mx?'Terreno no máximo':`${S.cols}x${S.rows}, ganha uma ${S.cols<=S.rows?'coluna':'linha'}`,p:lc(),full:mx,buy(){S.cols<=S.rows?S.cols++:S.rows++;buildMap()}},
  {id:'wk',i:'🧑‍🌾',t:`Trabalhador (${S.wk}/10)`,s:'Faz uma tarefa por vez: plantar, colher ou coletar',p:wc(),lv:WL[S.wk],full:S.wk>=10,buy(){S.wk++}},
  {id:'sp',i:'👢',t:`Botas ágeis (${S.sp}/5)`,s:'Trabalhadores 15% mais rápidos',p:bc(),lv:3+2*S.sp,full:S.sp>=5,buy(){S.sp++}},
  ...AM.map(m=>({id:m.k,i:m.e,t:`${m.n} (${cnt(m.k)}/${m.max})`,s:`${m.pn} a cada ${fmt(m.every)}, vale ${m.val} 💰. Coleta no mapa`,p:m.base+m.step*cnt(m.k),lv:m.lv,full:cnt(m.k)>=m.max,buy(){AN(m.k).n++;buildMap()}}))]};
function row(it){
  const lk=S.lv<(it.lv||1),dis=lk||it.full||S.coins<it.p;
  return `<div class="row${lk?' lock':''}"><span class="i">${it.i}</span><span class="t"><b>${it.t}</b><small>${lk?`<span class="tag">🔒 Nível ${it.lv}</span> `:''}${it.s}</small></span><button data-a="${it.id}"${dis?' disabled':''}>${lk?'🔒 Nv '+it.lv:it.full?'Cheio':it.p+' 💰'}</button></div>`}
function shop(){
  $('#box').innerHTML=`<h2>Loja da fazenda <button data-a="x">Fechar</button></h2>`+SH().map(row).join('')+
   `<div class="row"><span class="t"><small>Apagar o progresso salvo</small></span><button data-a="reset">${armed?'Toque de novo':'Recomeçar'}</button></div>`}
function ach(){
  const L=A.map(a=>({a,d:!!S.ach[a[0]]})).sort((x,y)=>x.d-y.d),n=L.filter(x=>x.d).length;
  $('#box').innerHTML=`<h2>Conquistas ${n}/${A.length} <button data-a="x">Fechar</button></h2>`+
   L.map(({a,d})=>`<div class="row ${d?'done':'pend'}"><span class="i">${a[1]}</span><span class="t"><b>${a[2]}</b><small>${a[3]}</small></span>${d?`<span class="tag">+${a[5]} 💰</span><span class="ok">✓</span>`:`<span class="tag gold">${a[5]} 💰</span>`}</div>`).join('')}
function open(f){fn=f;f();$('#sheet').classList.add('on')}
$('#bs').onclick=()=>open(shop);$('#ba').onclick=()=>open(ach);
$('#sheet').onclick=e=>{
  const sh=$('#sheet'),a=e.target.dataset.a;
  if(e.target.id==='sheet'||a==='x')return sh.classList.remove('on');
  if(!a)return;
  if(a==='reset'){if(!armed){armed=true;setTimeout(()=>{armed=false},3000)}else{S=fresh();armed=false;sel=last='cenoura';buildMap();buildDock();sh.classList.remove('on')}}
  else{const it=SH().find(i=>i.id===a);if(it&&S.lv>=(it.lv||1)&&!it.full&&S.coins>=it.p){S.coins-=it.p;it.buy();pump()}}
  done();if(sh.classList.contains('on'))fn();
};
function chk(){A.forEach(a=>{if(!S.ach[a[0]]&&a[4]()){S.ach[a[0]]=1;S.coins+=a[5];bn(`Conquista: ${a[1]} ${a[2]} (+${a[5]} 💰)`)}})}

// ---------- Loop ----------
function tick(){
  const n=Date.now(),dt=Math.min(n-S.last,36e5);S.last=n;
  AM.forEach(m=>{const a=AN(m.k);if(!a.n)return;a.t+=dt*a.n;const iv=m.every*1000;while(a.t>=iv){if(a.q<m.cap)a.q++;a.t-=iv}});
  for(const key in S.pl){const p=S.pl[key];if(!p.a||n<p.a.e)continue;const t=p.a.t,k=C[p.c];p.a=0;
    if(t==='h'){earn(k.sell);S.st.h++;addXp(k.xp);pop(cm[key]&&cm[key].d,`+${k.sell} 💰`);p.c=null;p.w=0}}
  AM.forEach(m=>{const a=AN(m.k);if(!a.a||n<a.a.e)return;const g=a.q*m.val,x=pens.find(z=>z.m===m);
    earn(g);if(m.k==='hen')S.st.e+=a.q;a.q=0;a.a=0;pop(x&&x.d,`+${g} 💰`)});
  pump();
}
function ui(){
  const n=Date.now(),qs=new Set(S.q.map(t=>t.k)),ql=S.q.length;
  $('#coins').textContent=S.coins;$('#lvt').textContent='Nível '+S.lv;$('#xpb').style.width=(S.xp/need(S.lv)*100)+'%';
  $('#wkt').textContent=`🧑‍🌾 ${Math.max(0,free())}/${S.wk}`+(ql?` ⏳${ql}`:'');
  $('#bc').classList.toggle('on',ql>0);$('#bcn').textContent='✖ '+ql;
  $('#bw').classList.toggle('on',sel==='agua');
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.k===sel));
  const work=(a,tool)=>[' work',FARM(tool),fmt(Math.max(0,Math.ceil((a.e-n)/1000))),Math.min(1,(n-a.s)/(a.e-a.s))];
  cells.forEach(x=>{
    const p=S.pl[x.key];let cls='plot',em='',tm='',bw=0,r;
    if(p&&p.c){
      const k=C[p.c],tot=k.t*1000,el=n-p.p,pr=Math.min(1,el/tot),rem=tot+DEAD-el;
      if(p.a){[r,em,tm,bw]=work(p.a,p.a.t==='p'?'🌱':k.e);cls+=r}
      else if(pr<1){em=pr>.5?'🌿':'🌱';bw=pr;tm=fmt(Math.ceil((tot-el)/1000))}
      else if(rem>0){em=k.e;bw=rem/DEAD;tm=fmt(Math.ceil(rem/1000));cls+=' ready'+(bw<.3?' late':'')}
      else{em='🥀';cls+=' dead'}
      if(p.w&&em!=='🥀')cls+=' wet';
    }
    if(qs.has(x.key))cls+=' qd';
    paint(x,cls,em,tm,bw);
  });
  pens.forEach(x=>{
    const m=x.m,a=AN(m.k);let cls='plot pen',em=m.e,tm='',bw=0,r;
    if(a.a){[r,em,tm,bw]=work(a.a,m.pe);cls+=r}else if(a.q)cls+=' ready';
    if(qs.has('pen:'+m.k))cls+=' qd';
    x.ct.textContent=m.pe+a.q+'/'+m.cap;paint(x,cls,em,tm,bw);
  });
}
buildMap();buildDock();tick();chk();ui();
setInterval(()=>{tick();chk();ui();if(++tickN%20===0)save()},250);
document.addEventListener('visibilitychange',save);
</script>
</body>
</html>
