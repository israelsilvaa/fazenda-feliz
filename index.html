<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>🌻 Fazenda Feliz</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#7fcf6e;--g2:#72c262;--soil:#8a5a35;--soil2:#6b4326;--panel:#fff7dc;--ink:#3b2a14;--line:#e6d79b;--sun:#ffcf33;--water:#3ab8f0;--ok:#4caf2e;--top:calc(env(safe-area-inset-top,0px) + 8px);--bot:calc(env(safe-area-inset-bottom,0px) + 64px);--sheetb:calc(env(safe-area-inset-bottom,0px) + 84px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#2f5d2a;--g2:#295426;--soil:#6b4326;--soil2:#52331b;--panel:#2c2a1f;--ink:#f4ead2;--line:#4b4730}}
:root[data-theme="dark"]{--g1:#2f5d2a;--g2:#295426;--soil:#6b4326;--soil2:#52331b;--panel:#2c2a1f;--ink:#f4ead2;--line:#4b4730}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;background:repeating-linear-gradient(45deg,var(--g1) 0 28px,var(--g2) 28px 56px)}
#view{position:fixed;inset:0;touch-action:none;cursor:grab}
#map{position:absolute;left:0;top:0;display:grid;gap:6px;padding:10px;background:#0002;border:4px solid var(--soil2);border-radius:18px;will-change:transform}
.plot{width:74px;height:74px;border-radius:12px;position:relative;display:grid;place-items:center;font-size:36px;border:3px solid var(--soil2);background:repeating-linear-gradient(90deg,var(--soil) 0 10px,var(--soil2) 10px 12px)}
.tm:empty{display:none}.tm{position:absolute;top:auto;bottom:13px;left:50%;transform:translateX(-50%);font-size:10px;line-height:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;z-index:3;background:#342416d9;border:1px solid #fff8;border-radius:7px;padding:0 4px;white-space:nowrap;box-shadow:0 1px 3px #0006}
.em{position:relative;z-index:1;display:grid;place-items:center;width:64px;height:64px;pointer-events:none}.em:has(.crop-svg){width:66px;height:52px;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(2,26px);gap:0;align-content:center;justify-content:center;overflow:visible}.crop-svg{width:28px;height:32px;overflow:visible}.dead .crop-svg{filter:grayscale(.75) sepia(.25) opacity(.85)}
.bar{position:absolute;left:7px;right:7px;bottom:5px;height:6px;border-radius:4px;background:#0006;overflow:hidden;z-index:2}
.bar u{display:block;height:100%;width:0;background:#7ddc5a}
.thirst{background:repeating-linear-gradient(90deg,#b98b5a 0 10px,#a0764a 10px 12px);box-shadow:0 0 0 3px var(--water)}
.thirst::after{content:'💧';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;line-height:1;z-index:4;pointer-events:none}
.thirst .bar u{background:var(--water)}
.fert{box-shadow:0 0 0 3px #b07cff}
.fert-level{position:absolute;right:-6px;top:-7px;z-index:5;width:23px;height:23px;border-radius:50%;display:none;place-items:center;background:linear-gradient(145deg,#fff4a8,#ffc52e);border:2px solid #8d5a12;color:#4b2d08;font-size:11px;font-weight:700;line-height:1;box-shadow:0 1px 3px #0008}
.fert-level.on{display:grid}
.fert-level::before{content:'⚡';position:absolute;font-size:13px;transform:translate(-1px,-1px);text-shadow:0 1px #fff8}
.fert-level::after{content:attr(data-level);position:absolute;right:-4px;bottom:-4px;min-width:12px;height:12px;padding:0 2px;border-radius:8px;display:grid;place-items:center;background:#6338a5;color:#fff;border:1px solid #fff;font-size:8px;line-height:10px}
.fertilizer-icon{display:inline-grid;place-items:center;position:relative;width:25px;height:25px;font-size:22px;line-height:1}
.fertilizer-icon::before{content:'⚡'}
.fertilizer-icon::after{content:attr(data-level);position:absolute;right:-7px;top:-5px;min-width:14px;height:14px;padding:0 2px;border-radius:50%;display:grid;place-items:center;background:#6338a5;color:#fff;border:1px solid #fff;font-size:9px;font-weight:700;line-height:12px}
#ttl{position:absolute;left:50%;top:-30px;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none;background:linear-gradient(135deg,#fff4c4,#ffe08a);color:#68451d;border:2px solid #b98535;border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 #68451d55,0 5px 12px #0002;font-size:14px;font-weight:700;text-shadow:0 1px #fff8}
#ttl small{display:block;font-size:9px;font-weight:600;opacity:.8;text-shadow:none}
.ready{box-shadow:0 0 0 3px var(--sun),0 0 7px 2px #ffcf3370}
.ready .bar u{background:#ffb02e}
.ready .tm{left:50%;right:auto;width:auto;max-width:62px;text-align:center;font-size:9px;line-height:13px;background:#9b4b16ed;border-radius:7px;padding:0 4px;text-shadow:0 1px 2px #000}
/* Partículas douradas discretas; todas as plantas prontas compartilham o mesmo ritmo. */
.ready .em::after{content:"";position:absolute;left:50%;bottom:7px;width:3px;height:3px;border-radius:50%;background:#fff0a0;box-shadow:0 0 4px 1px #ffe65c, -9px 4px 0 -1px #fff0a0, 8px 1px 0 -1px #fff0a0;pointer-events:none;z-index:4;animation:plantParticles 2.4s ease-out infinite;animation-delay:-1.2s}
#map.large .ready .em::after{display:none}#map.large .rare-gold,#map.large .rare-magic,#map.large .rare-rainbow,#map.large .rare-crystal{box-shadow:0 0 0 3px currentColor}
@keyframes plantParticles{0%{transform:translate(-50%,5px);opacity:0}18%{opacity:.9}82%{opacity:.7}100%{transform:translate(-50%,-24px);opacity:0}}
.late .bar u{animation:blink .5s steps(2) infinite}
.dead{filter:grayscale(.8) brightness(.8)}
/* Aparência das variedades raras e evolução do terreno */
.rare-gold{box-shadow:0 0 0 3px #f6c642,0 0 18px 5px #ffd95a88}
.rare-magic{box-shadow:0 0 0 3px #79baff,0 0 18px 5px #71b7ff99}
.rare-rainbow{box-shadow:0 0 0 3px #d58cff,0 0 20px 6px #e4a0ff99}
.rare-crystal{box-shadow:0 0 0 3px #72e6e0,0 0 18px 5px #7bfff099}.rare-gold::after,.rare-magic::after,.rare-rainbow::after,.rare-crystal::after{content:'✦';position:absolute;right:3px;top:0;font-size:12px;color:#fff3a3;text-shadow:0 0 5px #fff;pointer-events:none}
.tier-stone{border-color:#8e9698;background:repeating-linear-gradient(90deg,#777d7d 0 10px,#626969 10px 12px)}
.tier-fertile{border-color:#4c8b37;background:repeating-linear-gradient(90deg,#80502d 0 10px,#5d3b23 10px 12px)}
.tier-magic{border-color:#9870c7;background:repeating-linear-gradient(90deg,#76519b 0 10px,#583b78 10px 12px)}
.tier-gold{border-color:#e4b82e;background:repeating-linear-gradient(90deg,#a97922 0 10px,#805719 10px 12px)}
.row .t small .meter{display:block;height:5px;background:#0002;border-radius:5px;margin-top:4px;overflow:hidden}.row .t small .meter u{display:block;height:100%;background:#70bd4e}
.daily-panel{margin:10px 0;padding:10px;border:2px solid var(--line);border-radius:12px;background:#00000008}.daily-panel h3{margin:0 0 5px;font-size:16px}.daily-panel .row{padding:7px 0}.daily-panel button{border:0;border-radius:9px;padding:6px 9px;background:#e9bd42;color:#422d0c;font-weight:700}

.dead .bar{display:none}
.splash{animation:splash .45s}
.qd::before{content:'⏳';position:absolute;left:4px;bottom:11px;font-size:14px;z-index:2}
.work{box-shadow:0 0 0 3px #fff8}
.work .bar u{background:#fff}
/* radar */
.rd{position:absolute;inset:5px;border-radius:50%;display:none;overflow:hidden;border:2px solid #9fffb0aa;background:radial-gradient(circle,#0000 0 28%,#9fffb055 29% 31%,#0000 32% 58%,#9fffb044 59% 61%,#0000 62%),#0a2a10aa}
.work .rd{display:block}
.rd::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#0000 0 70%,#9fffb0e0 100%);}
/* fazendeiro */
.em svg{width:44px;height:44px;overflow:visible}
.bd{animation:hop .55s ease-in-out infinite alternate}
.hoe{transform-origin:30px 27px;animation:swing .55s ease-in-out infinite alternate}
.tl{position:absolute;right:-8px;top:-8px;font-size:16px;font-style:normal;animation:bob .55s ease-in-out infinite}
#pens{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pen{background:repeating-linear-gradient(0deg,#c99a4b 0 9px,#b5863c 9px 11px);border-color:#7a5420}
.cnt{position:absolute;top:1px;right:4px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;z-index:2}
@keyframes sweep{to{transform:rotate(1turn)}}
#map.many-work .bd,#map.many-work .tl{animation:none}
#map.many-ready .ready .em::after{display:none}
@keyframes swing{from{transform:rotate(-38deg)}to{transform:rotate(28deg)}}
@keyframes hop{to{transform:translateY(-1.5px)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{50%{opacity:.2}}
@keyframes splash{40%{box-shadow:0 0 0 12px #3ab8f099;transform:scale(1.07)}}
.p{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:5px 10px;position:fixed;z-index:5}
#lv{top:var(--top);left:calc(env(safe-area-inset-left,0px) + 8px);min-width:128px;font-weight:700}#lv .lv-star{display:inline-block;color:#2e8bff;font-size:17px;margin-right:4px;text-shadow:0 1px 0 #0b3a7a,0 0 5px #9cc9ff;vertical-align:-1px}
#lv small{display:block;height:7px;border-radius:5px;background:#0003;margin-top:3px;overflow:hidden}
#lv u{display:block;height:100%;width:0;background:var(--sun)}
#co{top:var(--top);right:calc(env(safe-area-inset-right,0px) + 8px);font-weight:700;font-size:19px}
#resources{position:fixed;z-index:5;top:calc(var(--top) + 54px);left:calc(env(safe-area-inset-left,0px) + 8px);display:flex;gap:5px;max-width:58vw;justify-content:flex-start;pointer-events:none}
.resource{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:3px 7px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 4px #0002}
#wk{top:var(--top);left:50%;transform:translateX(-50%);font-weight:700;font-size:15px;white-space:nowrap;padding:4px 8px}
.fab{position:fixed;z-index:6;width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--panel);font-size:22px;line-height:1;padding:0;cursor:pointer;color:inherit;bottom:calc(var(--bot) + var(--n,0)*64px)}
.fab small{display:block;font-size:9px;font-weight:600;margin-top:1px}
.fab.l{left:calc(env(safe-area-inset-left,0px) + 10px)}
.fab.r{right:calc(env(safe-area-inset-right,0px) + 10px)}
.fab.on{background:var(--water);border-color:#fff;box-shadow:0 0 0 3px var(--water)}
#bc{display:none;background:#ffd6d0;color:#7a1d10;border-color:#e57a6a}#bc.on{display:block;background:#ffd6d0;box-shadow:none;border-color:#e57a6a}
#bak{position:absolute;top:-5px;right:-5px;background:#e53935;color:#fff;border-radius:10px;min-width:20px;font-size:12px;font-weight:700;padding:1px 4px;display:none}
#bcn{font-size:17px;font-weight:700}
#dock{position:fixed;z-index:5;left:calc(env(safe-area-inset-left,0px) + 76px);right:calc(env(safe-area-inset-right,0px) + 76px);bottom:var(--bot);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;scrollbar-width:thin;scrollbar-color:#d6a52b #6b432655;cursor:grab;overscroll-behavior-x:contain;touch-action:pan-x}
#dock::-webkit-scrollbar{height:7px}#dock::-webkit-scrollbar-track{background:#6b432655;border-radius:8px}#dock::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#f6d76c,#c18a19);border:1px solid #fff5;border-radius:8px}#dock.dragging{cursor:grabbing;user-select:none}
.chip{position:relative;flex:0 0 auto;min-width:66px;height:56px;border-radius:14px;border:3px solid var(--line);background:var(--panel);color:inherit;font:inherit;font-size:24px;line-height:1;padding:2px 4px;cursor:pointer}
.chip small{display:block;font-size:11px;font-weight:600;margin-top:2px}
.chip.on{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.chip.lock{background:#0003;border-style:dashed}
.chip.lock .g{filter:grayscale(1);opacity:.35}
.chip b{position:absolute;top:2px;right:3px;font-size:13px}
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:#0007}
#sheet.on{display:flex}
#zoom{position:fixed;z-index:6;right:10px;top:calc(var(--top) + 58px);display:flex;gap:6px}
#zoom button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px;font-weight:700}
.help-row{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:2px solid var(--line)}
.help-row .i{font-size:25px;min-width:34px;text-align:center}
.help-row small{display:block;opacity:.82;line-height:1.35}
#helptext{line-height:1.4}
.box{background:var(--panel);width:100%;max-width:520px;margin:0 auto;max-height:78dvh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px var(--sheetb)}
.box h2{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:2px solid var(--line)}
.row .i{font-size:28px}.level-ach-icon{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;position:relative;border-radius:11px;background:linear-gradient(145deg,#fff1a8,#f7c33d);border:2px solid #c58a17;color:#68430c;box-shadow:0 2px 0 #986a13}.level-ach-icon b{font-size:17px;line-height:1}.level-ach-icon span{position:absolute;right:-5px;top:-7px;font-size:17px;color:#2e8bff;text-shadow:0 1px 1px #0b3a7a,0 0 3px #fff}.row .t{flex:1}.row small{display:block;opacity:.8}
.box button{font:inherit;cursor:pointer;color:#3b2a14;background:var(--sun);border:0;border-radius:10px;padding:7px 12px;font-weight:600}
.box button:disabled{opacity:.4;cursor:not-allowed}
.row.lock{opacity:.6}.row.lock .i{filter:grayscale(1)}
.tag{display:inline-block;background:#0002;border-radius:8px;padding:0 6px;font-size:12px;font-weight:700;opacity:1}
.gold{background:var(--sun);color:#3b2a14}
.row.done{background:linear-gradient(90deg,#4caf2e33,#4caf2e0d);border:2px solid var(--ok);border-radius:12px;margin:4px 0}
.row.done .tag{background:var(--ok);color:#fff}
.ok{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700}
.row.claim{background:#ffcf3333;border:2px solid var(--sun);border-radius:12px;margin:4px 0}
.row.pend .i{filter:grayscale(1);opacity:.7}
#bn{position:fixed;z-index:30;top:calc(var(--top) + 58px);left:50%;transform:translate(-50%,-20px);background:var(--sun);color:#3b2a14;font-weight:700;padding:8px 16px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;text-align:center;max-width:90vw}
#bn.on{opacity:1;transform:translate(-50%,0)}
.pop{position:fixed;pointer-events:none;font-weight:700;color:#fff;text-shadow:0 1px 3px #000b;z-index:9;animation:up .9s forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-44px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ready,.pop,.thirst::after,.ready .em::after,.late .bar u,.splash,.hoe,.bd,.tl{animation:none}.rd::before{animation-duration:3s}}
:focus-visible{outline:3px solid #2b7de9;outline-offset:2px}
/* ranking global */
.rk-nota{margin:0 0 8px;font-size:13px;opacity:.8}
.rk-form{display:grid;gap:8px;margin-bottom:10px}
.rk-form button{padding:10px}
#rk-nome{width:100%;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;color:#3b2a14;user-select:text;-webkit-user-select:text}
#rk-msg{margin:0;min-height:1.3em;font-size:14px}
.rk-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 4px;border-top:2px solid var(--line)}
.rk-row.eu{background:#ffcf3340;border-radius:10px}
.rk-pos{min-width:30px;text-align:center;font-weight:700}
.rk-nome{flex:1;min-width:90px;font-weight:600;overflow-wrap:anywhere}
.rk-nome small{font-weight:400;opacity:.6}
.rk-b{background:#0002;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.rk-vazio{margin:8px 0;opacity:.8}
</style>
</head>
<body>
<div id="view"><div id="map"></div></div>
<div class="p" id="lv"><span class="lv-star" aria-hidden="true">★</span><span id="lvt"></span><small><u id="xpb"></u></small></div>
<div class="p" id="wk"><span id="wkt"></span></div>
<div class="p" id="co">💰 <span id="coins">0</span></div>
<div id="resources"><span class="resource" id="compostCount">♻️ 0</span><span class="resource" id="crystalCount">💎 0</span></div>
<button class="fab l" id="bw" aria-label="Regar">💧</button>
<button class="fab l" id="bh" style="--n:1" aria-label="Colher tudo">🧺<small>Colher</small></button>
<button class="fab l" id="bp" style="--n:2" aria-label="Plantar tudo">🌱<small>Plantar</small></button>
<button class="fab l" id="bu" style="--n:3" aria-label="Regar automático">🚿<small>Auto</small></button>
<button class="fab r" id="bs" aria-label="Loja">🛒</button>
<button class="fab r" id="ba" style="--n:1" aria-label="Conquistas">🏆<span id="bak"></span></button>
<button class="fab r" id="bc" style="--n:2" aria-label="Cancelar fila"><span id="bcn"></span><small>Cancelar</small></button>
<button class="fab r" id="bf" style="--n:3" aria-label="Adubo automático">🧪<small>Auto adubo</small></button>
<button class="fab r" id="brank" style="--n:5" aria-label="Ranking global">👑<small>Ranking</small></button>
<button class="fab r" id="bhelp" style="--n:4" aria-label="Ajuda">❔<small>Ajuda</small></button>
<div id="zoom"><button id="zout" aria-label="Diminuir zoom">−</button><button id="zin" aria-label="Aumentar zoom">+</button></div>
<div id="dock"></div>
<div id="bn"></div>
<div id="sheet"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s),KEY='fazenda-feliz-v2',WC=0,TH=k=>k.t>=140?[.35,.7]:[.5],WL=[1,2,3,4,6,8,10,12,14,16];

// ---------- Dados ----------
const CR=[ // k, nome, emoji, custo, venda, tempo(s), nível
 ['cenoura','Cenoura','🥕',5,12,10,1],['batata','Batata','🥔',8,20,15,2],['trigo','Trigo','🌾',10,26,20,2],
 ['milho','Milho','🌽',20,55,35,3],['tomate','Tomate','🍅',35,95,55,4],['alface','Alface','🥬',45,125,70,5],
 ['morango','Morango','🍓',50,140,75,5],['abobora','Abóbora','🎃',60,170,90,6],['pimenta','Pimenta','🌶️',75,215,105,7],
 ['melancia','Melancia','🍉',100,290,140,8],['berinjela','Berinjela','🍆',130,370,170,9],['brocolis','Brócolis','🥦',160,460,200,10],
 ['uva','Uva','🍇',220,640,260,12],['abacaxi','Abacaxi','🍍',300,880,330,13],['girassol','Girassol','🌻',400,1200,420,15],
 ['manga','Manga','🥭',550,1650,540,17],['coco','Coco','🥥',800,2400,720,19]
].map(([k,n,e,cost,sell,t,lv])=>({k,n,e,cost,sell,t,lv,xp:Math.round(t*.4)}));
const C=Object.fromEntries(CR.map(c=>[c.k,c]));
const AM=[ // animais: k, nome, emoji, produto, emoji prod, valor, intervalo(s), capacidade, máx, nível, preço base, passo
 ['hen','Galinha','🐔','Ovo','🥚',8,15,12,6,2,60,40],['cow','Vaca','🐄','Leite','🥛',40,40,6,3,5,250,150],
 ['sheep','Ovelha','🐑','Lã','🧶',70,60,6,3,8,500,300],['pig','Porco','🐖','Bacon','🥓',120,90,5,3,11,900,500],
 ['bee','Colmeia','🐝','Mel','🍯',200,120,4,2,14,1500,800]
].map(([k,n,e,pn,pe,val,every,cap,max,lv,base,step])=>({k,n,e,pn,pe,val,every,cap,max,lv,base,step}));
const A=[ // id, emoji, nome, descrição, teste, prêmio
 ['l2','🌱','Primeiros passos','Chegue ao nível 2',()=>S.lv>=2,15],
 ['l3','🪴','Aprendiz do campo','Chegue ao nível 3',()=>S.lv>=3,20],
 ['l4','🌿','Mão verde','Chegue ao nível 4',()=>S.lv>=4,30],

function start(t){
  const n=Date.now();
  if(t.k.startsWith('pen:')){const a=AN(t.k.slice(4));if(a.n&&a.q&&!a.a)a.a={t:'c',s:n,e:n+HT()};return}
  const p=P(t.k);
  if(t.t==='p'){
    const k=C[t.c];if(p.c||p.a)return;
    if(S.coins<k.cost)return bn('Faltam moedas para plantar');
    S.coins-=k.cost;const e=n+pt(k);const useFert=!!(S.autoFert&&(S.items.f3||S.items.f2||S.items.f1));const rare=rollRarity();S.st.planted=S.st.planted||{};S.st.planted[t.c]=(S.st.planted[t.c]||0)+1;Object.assign(p,{c:t.c,g:0,w:0,th:0,f:0,fm:0,fe:0,rt:0,died:0,rare,q:0,shieldUntil:0,a:{t:'p',s:n,e}});if(useFert){useFertilizer(p);}pop(cm[t.k]&&cm[t.k].d,`-${k.cost}`);
  }else if(p.c&&!p.a&&p.rt&&!p.died)p.a={t:'h',s:n,e:n+HT()};
}
const pump=()=>{while(S.q.length&&free()>0)start(S.q.shift())};
const queued=k=>S.q.some(t=>t.k===k);
function run(t,d){if(queued(t.k))return pop(d,'Na fila ⏳');if(free()<=0)return pop(d,'Sem trabalhador livre');start(t)}
function enqueue(ts){S.q.push(...ts);pump()}

function water(p,d,manual=true){p.th=0;p.w++;S.st.w++;S.daily.water=(S.daily.water||0)+1;addXp(1);if(manual){pop(d,'💦');if(d){d.classList.add('splash');setTimeout(()=>d.classList.remove('splash'),450)}buzz()}else popAutoWater(d)}
function act(key,d){
  const n=Date.now();
  if(key.startsWith('pen:')){const a=AN(key.slice(4));
    if(a.a)return pop(d,'Coletando...');if(!a.q)return pop(d,'Nada para coletar');run({k:key,t:'c'},d)}
  else{
    const p=P(key);
    if(p.a)return pop(d,p.a.t==='p'?'Plantando...':'Colhendo...');
    if(p.c&&sel==='veneno'&&!p.died){if(!S.items.poison)bn('Sem veneno. Compre na loja');else{S.items.poison--;p.died=1;p.rt=Date.now();p.g=C[p.c].t*1000;p.a=0;S.st.dead=(S.st.dead||0)+1;S.st.poison=(S.st.poison||0)+1;pop(d,'☠️ Planta eliminada');buzz()}done();return}
    
    if(!p.c){if(isT())return pop(d,'Plante antes');run({k:key,t:'p',c:sel},d)}
    else if(p.rt){if(p.died){S.st.compost=(S.st.compost||0)+1+(S.upgrades.compost||0);clr(p);pop(d,'♻️ +composto')}else run({k:key,t:'h'},d)}
    else if(sel==='agua')p.th?water(p,d):pop(d,'Não precisa de água');
    else if(['f1','f2','f3'].includes(sel)){if(p.fm&&Date.now()<p.fe)pop(d,'Esta planta já está adubada');else if(useFertilizer(p,sel)){const f=fertilizerInfo[sel];pop(d,`${sel==='f1'?'🌿':sel==='f2'?'🌱':'🌟'} ${f.name}: crescimento ${f.mult.toFixed(1)}x por ${f.dur/60000} min`);bn(`${f.name} aplicado! +${Math.round((f.mult-1)*100)}% de velocidade por ${f.dur/60000} min.`);buzz()}else bn(`Sem ${fertilizerInfo[sel].name.toLowerCase()}. Compre na loja.`)}
    else if(sel==='veneno'){if(!S.items.poison)bn('Sem veneno. Compre na loja');else if(p.rt||p.g>0){S.items.poison--;p.died=1;p.rt=Date.now();p.g=C[p.c].t*1000;p.a=0;S.st.dead=(S.st.dead||0)+1;S.st.poison=(S.st.poison||0)+1;pop(d,'☠️ Planta eliminada');buzz()}else pop(d,'Planta ainda não cresceu')}
    else if(sel==='pocao'){if(!S.items.potion)bn('Sem poção. Compre na loja');else if(p.rt)pop(d,'Já está pronta');else{S.items.potion--;const k=C[p.c],tot=k.t*1000;p.g=Math.min(tot,p.g+tot*.15);if(p.g>=tot){p.rt=Date.now();p.th=0}pop(d,'🧪 Poção: +15% de crescimento instantâneo');bn('🧪 Poção aplicada: +15% do crescimento da planta');buzz()}}
    else pop(d,p.th?'Precisa de água! 💧':'Crescendo...');
  }
  done();
}
function bulk(kind){
  const n=Date.now(),ts=[],ok=t=>!queued(t.k);
  if(kind==='p'){
    const c=isT()?last:sel,k=C[c];
    cells.forEach(x=>{const p=S.pl[x.key];if(!(p&&(p.c||p.a)))ts.push({k:x.key,t:'p',c})});
    const can=Math.floor(S.coins/k.cost);
    if(!ts.length)return bn('Sem canteiros livres');
    if(!can)return bn(`Faltam moedas para ${k.e} ${k.n}`);
    ts.splice(can);
  }else{
    cells.forEach(x=>{const p=S.pl[x.key];if(!p||!p.c||p.a||!p.rt)return;
      if(p.died){S.st.compost=(S.st.compost||0)+1+(S.upgrades.compost||0);clr(p)}else ts.push({k:x.key,t:'h'})});
    pens.forEach(x=>{const a=AN(x.m.k);if(a.q&&!a.a)ts.push({k:'pen:'+x.m.k,t:'c'})});
    if(!ts.length)return bn('Nada para colher');
  }
  const add=ts.filter(ok);enqueue(add);bn(`${add.length} tarefas na fila`);done();
}

    <h3>🛒 Loja e evolução</h3>
    <div class="help-row"><span class="i">🛒</span><span><b>As cinco melhorias permanentes</b><small>Solo fértil: +5% de velocidade de crescimento por nível. Mãos rápidas: trabalhadores 5% mais rápidos por nível. Olho de agricultor: aumenta a chance de qualidade excelente. Sorte no jardim: +15% de chance relativa de raridade por nível. Compostagem: +1 composto extra ao limpar uma planta morta por nível. Cada melhoria tem até 5 níveis.</small></span></div>
    <div class="help-row"><span class="i">🪨</span><span><b>Evolução dos canteiros</b><small>Há quatro evoluções sequenciais: pedra, fértil, mágico e dourado. Pedra dá um visual resistente; fértil dá +5% de crescimento; mágico aumenta em 50% a chance de raridade; dourado dá +10% de moedas na colheita. Cada evolução substitui o nível anterior, não soma o bônus antigo. É preciso comprar na ordem e cada etapa tem seu custo e nível mínimo na loja.</small></span></div>
    <div class="help-row"><span class="i">🗺️</span><span><b>Terreno</b><small>Amplie o terreno pela loja até o limite de 10×10 (100 canteiros). Use os botões + e − para ajustar o zoom e arraste o mapa para se mover.</small></span></div>
    <h3>🧑‍🌾 Trabalhadores, fila e animais</h3>
    <div class="help-row"><span class="i">🧑‍🌾</span><span><b>Trabalhadores e fila</b><small>Você começa com 1 trabalhador e pode contratar até 10. Cada trabalhador executa uma tarefa por vez: plantar, colher ou coletar de um animal. Tarefas sem trabalhador livre entram na fila; o botão Cancelar limpa a fila. Trabalhadores levam cerca de 5 segundos por tarefa, antes dos bônus de velocidade.</small></span></div>
    <div class="help-row"><span class="i">🐔</span><span><b>Animais e coleta</b><small>Galinha libera no nível 2: produz ovos a cada 15 s (até 12), cada um vale 8 moedas. Vaca libera no nível 5: leite a cada 40 s (até 6), vale 40. Ovelha libera no nível 8: lã a cada 60 s (até 6), vale 70. Porco libera no nível 11: bacon a cada 90 s (até 5), vale 120. Colmeia libera no nível 14: mel a cada 120 s (até 4), vale 200. Compre na loja, aguarde a produção e toque no cercado ou use Colher para colocar a coleta na fila. Cada coleta ocupa um trabalhador.</small></span></div>
    <h3>🧰 Ferramentas e recursos</h3>
    <div class="help-row"><span class="i">⚡</span><span><b>Adubos</b><small>Adubo nível 1 acelera 20% por 2 minutos; nível 2 acelera 30% por 3 minutos; nível 3 acelera 40% por 8 minutos. Selecione o adubo na barra e toque em uma planta em crescimento. Não acumula dois adubos na mesma planta. Auto adubo aplica automaticamente o melhor disponível (nível 3, depois 2 e 1) ao plantar.</small></span></div>
    <div class="help-row"><span class="i">☠️</span><span><b>Veneno e composto</b><small>O veneno elimina uma planta. Limpe a planta morta tocando nela ou usando Colher para receber composto. Cada nível de Compostagem aumenta o composto recebido. Troque 5 compostos por 3 adubos simples na loja.</small></span></div>
    <div class="help-row"><span class="i">🧪</span><span><b>Poção</b><small>A poção adianta instantaneamente 15% do crescimento de uma planta. Compre pacotes na loja e selecione na barra inferior para usar.</small></span></div>
    <div class="help-row"><span class="i">📅</span><span><b>Missões e conquistas</b><small>Missões diárias: colha 15 plantas (100 moedas), regue 10 vezes (80 moedas) e use 2 adubos (120 moedas). Elas reiniciam à meia-noite no horário local. Conquistas dão moedas por metas de nível, colheita, animais, qualidade, raridades e muito mais; algumas são secretas.</small></span></div>
    <div class="help-row"><span class="i">💾</span><span><b>Salvamento e progresso offline</b><small>O jogo salva automaticamente neste navegador, aproximadamente a cada 5 segundos e ao sair/ocultar a aba. Ao voltar, calcula até 1 hora de progresso offline para crescimento e produção dos animais. Use o mesmo navegador e aparelho para continuar seu jogo.</small></span></div>
  </div>`;
}
function ach(){
  const visible=A.filter(a=>!a[6]||S.ach[a[0]]),st=a=>S.clm[a[0]]?2:S.ach[a[0]]?0:1,L=[...visible].sort((x,y)=>st(x)-st(y)),n=A.filter(a=>st(a)===2).length,cl=A.filter(a=>st(a)===0).length;
  const prog=a=>{const id=a[0],crops=S.st.crops||{};let cur=0,max=0;
    if(id==='sun1'){cur=(S.st.planted||{}).girassol||0;max=1}
    else if(id==='sun10'){cur=crops.girassol||0;max=10}
    else if(id==='variety'){cur=Object.values(crops).filter(v=>v>0).length;max=8}
    else if(id==='first'||id==='h25'||id==='h100'||id==='h500'){cur=S.st.h;max=({first:1,h25:25,h100:100,h500:500})[id]}
    else if(id==='dead5'||id==='dead10'||id==='dead25'){cur=S.st.dead||0;max=({dead5:5,dead10:10,dead25:25})[id]}
    else if(id==='h1000'||id==='h2500'){cur=S.st.h;max=id==='h1000'?1000:2500}
    else if(id==='w50'||id==='w100'){cur=S.st.w;max=id==='w50'?50:100}
    else if(id==='variety12'){cur=Object.values(crops).filter(v=>v>0).length;max=12}
    else if(id==='plant10'){cur=Object.values(S.st.planted||{}).filter(v=>v>0).length;max=10}
    else if(id==='r100'){cur=S.st.g;max=100000}
    else if(id==='q50'){cur=Object.entries(S.st.quality||{}).filter(([k])=>+k>=3).reduce((v,[,n])=>v+n,0);max=50}
    else if(id==='rare1'){cur=Object.values(S.st.rares||{}).reduce((v,n)=>v+n,0);max=1}
    else if(id==='combo20'){cur=S.st.bestCombo||0;max=20}
    else if(id==='poison10'){cur=S.st.poison||0;max=10}
    else if(id==='compost100'){cur=S.st.compost||0;max=100}
    else if(id==='secret_sun'){cur=S.st.perfectSun||0;max=5}
    else if(id==='w10'){cur=S.st.w;max=10}
    else if(id==='e20'){cur=S.st.e;max=20}
    else if(/^l(\d+)$/.test(id)){cur=S.lv;max=Number(id.slice(1))}
    else if(id==='wk3'||id==='wk6'||id==='wk10'){cur=S.wk;max=Number(id.slice(2))}
    else if(id==='r1'||id==='r3'||id==='r6'||id==='r10'||id==='r30'){cur=S.st.g;max=Number(id.slice(1))*1000}
    else if(id==='hen'||id==='cow'||id==='sheep'||id==='bee'){cur=cnt(id);max=1}
    else if(id==='land'){cur=S.cols*S.rows;max=36}
    return max?` · ${Math.min(cur,max)}/${max} (faltam ${Math.max(0,max-cur)})`:''};
  const R=(a,c,r)=>{const lm=a[0].match(/^l(\d+)$/),ico=lm?`<span class=\"level-ach-icon\"><b>${lm[1]}</b><span>★</span></span>`:a[1];return `<div class=\"row ${c}\"><span class=\"i\">${ico}</span><span class=\"t\"><b>${a[2]}</b><small>${a[3]}${prog(a)}</small></span>${r}</div>`};
  $('#box').innerHTML=`<h2>Conquistas ${n}/${A.length} <span>${cl?'<button data-a="claimall">Coletar tudo</button> ':''}<button data-a="x">Fechar</button></span></h2>`+
   L.map(a=>[R(a,'claim',`<button data-a="claim:${a[0]}">Coletar +${a[5]} 💰</button>`),R(a,'pend',`<span class="tag gold">${a[5]} 💰</span>`),R(a,'done',`<span class="tag">+${a[5]} 💰</span><span class="ok">✓</span>`)][st(a)]).join('')}
const claim=id=>{const a=A.find(x=>x[0]===id);if(a&&S.ach[id]&&!S.clm[id]){S.clm[id]=1;S.coins+=a[5];return a[5]}return 0};
function open(f){fn=f;f();$('#sheet').classList.add('on')}
$('#bs').onclick=()=>open(shop);$('#ba').onclick=()=>open(ach);

// ---------- Ranking global ----------
const RANK_API='/api/fazenda-ranking',RK_ID='fazenda-rank-token',RK_NAME='fazenda-rank-nome',RK_ME='fazenda-rank-me';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rkEsc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rkToken(){ // 64 caracteres hex; identifica este navegador no ranking
  let t=lsGet(RK_ID);
  if(!/^[a-f0-9]{64}$/.test(t||'')){t=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');lsSet(RK_ID,t)}
  return t}
function rkDraw(lista){
  const el=$('#rk-list');if(!el)return;const me=lsGet(RK_ME);
  if(!lista.length){el.innerHTML='<p class="rk-vazio">Ninguém no ranking ainda. Seja o primeiro!</p>';return}
  el.innerHTML=lista.map((r,i)=>`<div class="rk-row${r.id===me?' eu':''}"><span class="rk-pos">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="rk-nome">${rkEsc(r.nome)} <small>#${rkEsc(r.id.slice(0,4))}</small></span><span class="rk-b"><span style="color:#2e8bff">★</span> Nv ${r.lv}</span><span class="rk-b">💰 ${Number(r.moedas).toLocaleString('pt-BR')}</span></div>`).join('')}
async function rkLoad(){
  try{const r=await fetch(RANK_API,{cache:'no-store'});if(!r.ok)throw 0;rkDraw((await r.json()).ranking||[])}
  catch(e){const el=$('#rk-list');if(el)el.textContent='Ranking indisponível no momento.'}}
async function rkSave(){
  const inp=$('#rk-nome'),msg=$('#rk-msg'),btn=$('#rk-btn'),nome=inp.value.trim();
  if(!nome){msg.textContent='Digite seu nome.';inp.focus();return}
  btn.disabled=true;msg.textContent='Salvando…';
  try{
    const r=await fetch(RANK_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:rkToken(),nome,lv:S.lv,moedas:Math.floor(S.coins)})});
    const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.erro||'falhou');
    lsSet(RK_NAME,nome);lsSet(RK_ME,d.id);rkDraw(d.ranking);
    msg.textContent=!d.posicao?'Atualizado, mas você ainda não entrou no ranking.':d.posicao<=50?`Atualizado! Você está em ${d.posicao}º lugar.`:`Atualizado! Você está em ${d.posicao}º (o painel mostra o top 50).`;
  }catch(e){msg.textContent='Erro: '+e.message}
  finally{btn.disabled=false}}
function rankGlobal(){
  $('#box').innerHTML=`<h2>👑 Fazendeiros mais ricos <button data-a="x">Fechar</button></h2>
  <p class="rk-nota">Top 50. Ordem: maior nível primeiro; empate no nível, quem tem mais moedas. O ranking só muda quando você toca em Atualizar.</p>
  <div class="rk-form"><input id="rk-nome" type="text" maxlength="20" autocomplete="nickname" placeholder="Seu nome" value="${rkEsc(lsGet(RK_NAME)||'')}"><button id="rk-btn" data-a="rk-save">Atualizar meus dados (Nv ${S.lv} · 💰 ${Math.floor(S.coins)})</button><p id="rk-msg" aria-live="polite"></p></div>
  <div id="rk-list">Carregando…</div>`;
  rkLoad()}
$('#brank').onclick=()=>open(rankGlobal);
$('#sheet').onclick=e=>{
  const sh=$('#sheet'),a=e.target.dataset.a;
  if(e.target.id==='sheet'||a==='x')return sh.classList.remove('on');
  if(!a)return;
  if(a==='rk-save'){rkSave();return}
  if(a==='reset'){if(!armed){armed=true;setTimeout(()=>{armed=false},3000)}else{S=fresh();armed=false;sel=last='cenoura';buildMap();buildDock();sh.classList.remove('on')}}
  else if(a.startsWith('claim')){const t=a==='claimall'?A.reduce((s,x)=>s+claim(x[0]),0):claim(a.slice(6));if(t)bn(`🏆 +${t} 💰`)}
  else if(a.startsWith('daily:')){const t=dailyClaim(a.slice(6));if(t)bn(`📅 Missão concluída! +${t} 💰`);shop();save();return}
  else{const it=SH().find(i=>i.id===a);if(it&&S.lv>=(it.lv||1)&&!it.full&&S.coins>=it.p){S.coins-=it.p;it.buy();pump()}}
  done();if(sh.classList.contains('on'))fn();
};
function chk(){A.forEach(a=>{if(!S.ach[a[0]]&&a[4]()){S.ach[a[0]]=1;bn(`🏆 Conquista: ${a[1]} ${a[2]}! Colete o prêmio`)}})}

// ---------- Loop ----------
function tick(){
  const n=Date.now(),dt=Math.min(n-S.last,36e5);S.last=n;if(S.daily.date!==today())S.daily={date:today(),harvest:0,water:0,fert:0,claimed:{}};
  AM.forEach(m=>{const a=AN(m.k);if(!a.n)return;a.t+=dt*a.n;const iv=m.every*1000;while(a.t>=iv){if(a.q<m.cap)a.q++;a.t-=iv}});
  for(const key in S.pl){const p=S.pl[key];if(!p.c)continue;
    if(p.a){if(n<p.a.e)continue;const t=p.a.t,k=C[p.c];p.a=0;
      if(t==='h'){const now=Date.now();if(now-(S.comboAt||0)>30000){S.combo=0;S.comboTier=0}S.combo=(S.combo||0)+1;S.comboAt=now;const tier=S.combo>=20?3:S.combo>=10?2:S.combo>=5?1:0;const comboOnly=[1,1.02,1.05,1.10][tier],comboMult=comboOnly*(S.plotTier===4?1.10:1);const waterNeed=TH(k).length;const qRoll=Math.random()<(S.upgrades.quality||0)*.08;const quality=(p.fertUsed?4:qRoll?3:p.w>=waterNeed?2:1);const qMult=[1,1,1.2,1.5,2][Math.min(quality,4)];const rare=p.rare||'',rMult=rare?(rarityInfo[rare]?.mult||1):1;const val=Math.round(k.sell*qMult*comboMult*rMult);earn(val);S.st.h++;S.daily.harvest=(S.daily.harvest||0)+1;S.st.crops=S.st.crops||{};S.st.crops[k.k]=(S.st.crops[k.k]||0)+1;S.st.quality=S.st.quality||{};S.st.quality[quality]=(S.st.quality[quality]||0)+1;if(k.k==='girassol'&&quality===4)S.st.perfectSun=(S.st.perfectSun||0)+1;S.st.bestCombo=Math.max(S.st.bestCombo||0,S.combo);if(rare){S.st.rares=S.st.rares||{};S.st.rares[rare]=(S.st.rares[rare]||0)+1;if(rare==='crystal')S.st.crystals=(S.st.crystals||0)+1}addXp(k.xp);if(tier>S.comboTier){S.comboTier=tier;bn(`🔥 Combo ${S.combo}! bônus ${Math.round((comboOnly-1)*100)}%`)}const qName=['','Comum','Boa','Excelente','Perfeita'][quality];pop(cm[key]&&cm[key].d,`+${val} 💰 ${rare?rarityInfo[rare].emoji+' ':''}${qName}`);clr(p)}}
    else if(p.th){if(S.sprinkler||S.auto&&S.coins>=WC){if(!S.sprinkler)S.coins-=WC;water(p,cm[key]&&cm[key].d,false)}}
    else if(!p.rt){const k=C[p.c],tot=k.t*1000,boost=(p.fm&&n<(p.fe||0)?p.fm:(p.f?1.5:1)),rt=boost*(1+(S.upgrades.soil||0)*.05)*(S.plotTier===2?1.05:1),s=TH(k)[p.w],nx=s===undefined?tot:s*tot,ng=p.g+dt*rt;
      if(ng>=nx){p.g=nx;if(nx<tot)p.th=1;else p.rt=n-(ng-tot)/rt}else p.g=ng}}
  AM.forEach(m=>{const a=AN(m.k);if(!a.a||n<a.a.e)return;const g=a.q*m.val,x=pens.find(z=>z.m===m);
    earn(g);if(m.k==='hen')S.st.e+=a.q;a.q=0;a.a=0;pop(x&&x.d,`+${g} 💰`)});
  pump();
}
function ui(){
  const resetTimer=$('#dailyResetTimer');if(resetTimer)resetTimer.textContent=dailyResetRemaining();
  const n=Date.now(),qs=new Set(S.q.map(t=>t.k)),ql=S.q.length;
  $('#coins').textContent=S.coins;$('#compostCount').textContent='♻️ '+(S.st.compost||0);$('#crystalCount').textContent='💎 '+(S.st.crystals||0);$('#lvt').textContent='Nível '+S.lv;$('#map').classList.toggle('sprinkler-on',!!S.sprinkler);$('#xpb').style.width=(S.xp/need(S.lv)*100)+'%';
  $('#wkt').textContent=`🧑‍🌾 ${Math.max(0,free())}/${S.wk}`+(ql?` ⏳${ql}`:'');
  $('#bc').classList.toggle('on',ql>0);$('#bcn').textContent='✖ '+ql;
  $('#bw').classList.toggle('on',sel==='agua');$('#bu').classList.toggle('on',!!S.auto);$('#bf').classList.toggle('on',!!S.autoFert);
  const cl=A.filter(a=>S.ach[a[0]]&&!S.clm[a[0]]).length,bk=$('#bak');bk.textContent=cl;bk.style.display=cl?'block':'none';
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.k===sel));
  const tierClass=['','tier-stone','tier-fertile','tier-magic','tier-gold'][Math.min(4,S.plotTier||0)];
  const work=(a,tool)=>[' work',FARM(tool),fmt(Math.max(0,Math.ceil((a.e-n)/1000))),Math.min(1,(n-a.s)/(a.e-a.s))];
  let nr=0,nw=0;
  cells.forEach(x=>{
    const p=S.pl[x.key];let cls='plot '+tierClass,em='',tm='',bw=0,r,ct='';
    if(p&&p.c){
      if(p.rare)cls+=' rare-'+p.rare;
      const k=C[p.c],tot=k.t*1000,rt=(p.fm&&n<(p.fe||0)?p.fm:(p.f?1.5:1))*(1+(S.upgrades.soil||0)*.05)*(S.plotTier===2?1.05:1);ct='+'+k.sell;
      if(p.a){[r,em,tm,bw]=work(p.a,k.e);cls+=r}
      else if(p.rt){if(!p.died){em=cropCluster(p.c,1);bw=1;tm='';cls+=' ready'}else{em=cropCluster(p.c,1,true);cls+=' dead';ct=''}}
      else{bw=p.g/tot;em=cropCluster(p.c,Math.max(.18,bw));if(p.th){tm='Água!';cls+=' thirst'}else{const boosted=p.fm&&n<(p.fe||0);tm='';if(boosted){const tt=`Adubo nível ${p.fl||1}: ${fmt(Math.max(0,Math.ceil((p.fe-n)/1000)))} restantes · crescimento ${Math.round((p.fm-1)*100)}% mais rápido`;if(x.tm.title!==tt)x.tm.title=tt}else if(x.tm.hasAttribute('title'))x.tm.removeAttribute('title')}if(p.f||(p.fm&&n<(p.fe||0)))cls+=' fert'}
    }
    if(qs.has(x.key))cls+=' qd';
    if(cls.includes(' ready'))nr++;if(cls.includes(' work'))nw++;
    paint(x,cls,em,tm,bw,ct,p&&p.fm&&n<(p.fe||0)?(p.fl||1):0);
  });
  const mp=$('#map');mp.classList.toggle('many-ready',nr>8);
  pens.forEach(x=>{
    const m=x.m,a=AN(m.k);let cls='plot pen '+tierClass,em=m.e,tm='',bw=0,r;
    if(a.a){[r,em,tm,bw]=work(a.a,m.pe);cls+=r}else if(a.q)cls+=' ready';
    if(qs.has('pen:'+m.k))cls+=' qd';
    if(cls.includes(' work'))nw++;
    paint(x,cls,em,tm,bw,m.pe+a.q+'/'+m.cap);
  });
  mp.classList.toggle('many-work',nw>6);
}
buildMap();buildDock();tick();chk();ui();
setInterval(()=>{if(document.hidden)return;tick();chk();if(++tickN%2===0)ui();if(tickN%20===0)save()},250);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();return}tick();chk();ui();save()});
